<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ business_name }}{% endblock %}</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.6;
               color: #222; background: #f6f7f9; margin: 0; }
        header, footer { background: #1f3a5f; color: #fff; padding: 14px 20px; }
        header a, footer a { color: #fff; text-decoration: none; margin-right: 18px; }
        header .brand { font-weight: 700; font-size: 1.15rem; }
        main { max-width: 820px; margin: 24px auto; background: #fff; padding: 26px 30px;
               border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        h1 { margin-top: 0; font-size: 1.7rem; }
        h2 { margin-top: 1.6em; font-size: 1.2rem; }
        footer { font-size: .9rem; margin-top: 30px; }
        .muted { color: #666; font-size: .9rem; }
    </style>
</head>
<body>
<header>
    <a class="brand" href="{% url 'public-about' %}">{{ business_name }}</a>
    <a href="{% url 'public-privacy' %}">Privacy Policy</a>
    <a href="{% url 'public-terms' %}">Terms of Service</a>
</header>
<main>
    {% block content %}{% endblock %}
</main>
<footer>
    &copy; {{ business_name }} &middot; <a href="{% url 'public-privacy' %}">Privacy Policy</a>
    <a href="{% url 'public-terms' %}">Terms of Service</a>
    Contact: <a href="mailto:{{ contact_email }}">{{ contact_email }}</a>
</footer>
</body>
</html>
