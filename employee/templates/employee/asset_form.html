{% extends 'home.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-4">
    <h3>{% if asset %}Edit Asset{% else %}Add Asset{% endif %}</h3>
    <div class="row">
        <div class="col-8">
            <form method="post" autocomplete="off">
                {% csrf_token %}
                {{ form|crispy }}

                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{% url 'employee:asset_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
<link rel="stylesheet" href="{% static 'css/jquery.datetimepicker.min.css' %}">
<script src="{% static 'js/jquery.datetimepicker.full.min.js' %} "></script>
<script>
    $(function(){$( "#id_date_of_purchase").datetimepicker({format: 'd/m/Y h:i'})});
</script>

{% endblock %}
